spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/iulianlounge
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
# ADR-08: clave HMAC de los JWT, >=32 bytes, solo por entorno
jwt.secret=${JWT_SECRET}

# Sin el usuario en memoria que Boot crea por defecto: aquí solo se entra con JWT
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# /error es público: nunca stack trace, mensaje interno ni excepción. Explícito para que cambiarlo en otro perfil sea una decisión visible
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
