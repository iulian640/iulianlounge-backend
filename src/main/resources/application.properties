spring.application.name=backend
# Por entorno en prod (deploy/.env); por defecto, la BD de desarrollo de docker-compose.yml
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iulianlounge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# ADR-08: clave HMAC de los JWT en base64 (openssl rand -base64 32), solo por entorno
jwt.secret=${JWT_SECRET}

# Sin el usuario en memoria que Boot crea por defecto: aquí solo se entra con JWT
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# /error es público: nunca stack trace, mensaje interno ni excepción. Explícito para que cambiarlo en otro perfil sea una decisión visible
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Sin sesión de Hibernate abierta durante la vista: una carga lazy fuera del service falla aquí, no en producción
spring.jpa.open-in-view=false

spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

barman.llm.api-key=${ANTHROPIC_API_KEY:}
barman.llm.model=${BARMAN_LLM_MODEL:claude-haiku-4-5}
barman.llm.timeout=8s
barman.llm.max-tokens=150
barman.talk.max-per-minute=10
barman.talk.max-per-member-per-day=30
barman.talk.max-per-ip-per-day=60
barman.talk.global-budget-microusd=500000
barman.talk.max-in-flight=8
