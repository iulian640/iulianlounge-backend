spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/iulianlounge
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
# ADR-08: clave HMAC de los JWT, >=32 bytes, solo por entorno
jwt.secret=${JWT_SECRET}

# Orígenes con permiso CORS (coma-separados). Dev: Vite en 5173. Prod (mismo origen): vacío
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
