# Perfil de producción (SPRING_PROFILES_ACTIVE=prod en deploy/docker-compose.prod.yml)

# Detrás de Caddy: el esquema (https) y la IP del cliente llegan en X-Forwarded-*. Sin esto la app
# creería que todo entra por http desde la IP del proxy
server.forward-headers-strategy=framework

# Sin valores por defecto en prod: si falta alguna variable, la app no arranca (mejor que conectar a otra BD)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}

# Solo /actuator/health, y sin detalles de la BD ni del disco hacia fuera
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
