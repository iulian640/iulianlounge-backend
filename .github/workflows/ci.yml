name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    services:
          postgres:
            image: postgres:17
            env:
              POSTGRES_DB: iulianlounge
              POSTGRES_PASSWORD: ci-password
            ports:
              - 5432:5432
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: ./mvnw verify
        env:
          DB_PASSWORD: ci-password